name: Shared AI bridge validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/mmt-shared-memory-bridge-20261117

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server build

      - name: Run WhatsApp logistics unit tests
        run: pnpm --filter @workspace/api-server exec vitest run src/lib/whatsappLogisticsGate.test.ts src/lib/whatsappLogisticsIntake.test.ts src/lib/corsOriginPolicy.test.ts

      - name: Run panel API proxy tests
        run: node --test artifacts/mmt-global-website/tests/api-proxy.test.cjs
