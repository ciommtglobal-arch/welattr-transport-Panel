openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: limit-applications
    description: Corporate limit application operations
  - name: Storage
    description: Özel başvuru belgeleri için güvenli depolama işlemleri
  - name: payments
    description: Tami hosted ödeme işlemleri
paths:
  /payments/tami/hosted-session:
    post:
      operationId: createTamiHostedPaymentSession
      tags: [payments]
      summary: Kart bilgilerini MMT sistemine almadan Tami ödeme sayfası oluşturur
      description: |
        Tami Common Payment Page için tek kullanımlık ödeme adresi üretir.
        Kart numarası ve güvenlik kodu bu API'ye gönderilmez; müşteri Tami'nin
        hosted ödeme sayfasına yönlendirilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TamiHostedPaymentInput"
      responses:
        "201":
          description: Hosted ödeme oturumu oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiHostedPaymentSession"
        "400":
          description: Geçersiz ödeme isteği.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Tami entegrasyonu yapılandırılmamış.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Tami token servisi yanıt vermedi veya hatalı yanıt verdi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/tami/{orderId}:
    get:
      operationId: getTamiPaymentStatus
      tags: [payments]
      summary: Tami ödeme durumunu sorgular
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 36
      responses:
        "200":
          description: Ödeme durumu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiPaymentStatus"
        "404":
          description: Ödeme oturumu bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Tami entegrasyonu yapılandırılmamış.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Tami sorgu servisi yanıt vermedi veya hatalı yanıt verdi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/request-download-url:
    post:
      tags: [Storage]
      operationId: requestObjectDownloadUrl
      summary: Başvuru belgesi için kısa süreli imzalı okuma adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectDownloadUrlRequest"
      responses:
        "200":
          description: İmzalı okuma adresi oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDownloadUrlResponse"
        "400":
          description: Geçersiz obje yolu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Belge bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: İmzalı okuma adresi oluşturulamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Başvuru belgesi için güvenli yükleme adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Yükleme adresi oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Geçersiz dosya bilgisi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Yükleme adresi oluşturulamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/cleanup-orphans:
    post:
      tags: [Storage]
      operationId: cleanupOrphanUploads
      summary: Başvuruya bağlanmayan eski yüklemeleri raporlar veya temizler
      description: |
        Zamanlanmış bakım işi tarafından çağrılmak üzere tasarlanmıştır.
        Varsayılan saklama süresi 24 saattir ve ORPHAN_UPLOAD_RETENTION_HOURS
        ortam değişkeniyle artırılabilir. Yalnızca admin ve operations personeli
        çağırabilir. dryRun true olduğunda hiçbir obje silinmez.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanUploadCleanupRequest"
      responses:
        "200":
          description: Temizlik özeti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanUploadCleanupResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin or operations access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Geçersiz temizlik isteği.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Temizlik gerçekleştirilemedi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /limit-applications:
    post:
      operationId: createLimitApplication
      tags: [limit-applications]
      summary: Submit a limit application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplication"
        "400":
          description: Invalid application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getLimitApplications
      tags: [limit-applications]
      summary: List limit applications for authorized staff
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/LimitApplicationStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Applications page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplicationPage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /limit-applications/{id}/status:
    patch:
      operationId: updateLimitApplicationStatus
      tags: [limit-applications]
      summary: Update an application status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitApplicationStatusUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplication"
        "400":
          description: Invalid status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    TamiHostedPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, fullName, email, phone, description]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000000
          description: Türk lirası cinsinden ödeme tutarı.
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Masterpass doğrulaması için 905xxxxxxxxx formatına dönüştürülebilen telefon.
        description:
          type: string
          minLength: 2
          maxLength: 160
    TamiHostedPaymentSession:
      type: object
      required: [orderId, paymentUrl, status]
      properties:
        orderId:
          type: string
        paymentUrl:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/TamiPaymentStatusValue"
    TamiPaymentStatus:
      type: object
      required: [orderId, amount, currency, status]
      properties:
        orderId:
          type: string
        amount:
          type: number
        currency:
          type: string
          enum: [TRY]
        status:
          $ref: "#/components/schemas/TamiPaymentStatusValue"
        providerPaymentStatus:
          type: [string, "null"]
        providerOrderStatus:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
    TamiPaymentStatusValue:
      type: string
      enum: [pending, success, failed]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LimitApplicationStatus:
      type: string
      enum: [new, reviewing, approved, rejected]
    LimitApplication:
      type: object
      required:
        - id
        - referenceCode
        - applicationType
        - fullName
        - company
        - email
        - phone
        - requestType
        - amount
        - currency
        - documents
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        referenceCode:
          type: string
        applicationType:
          $ref: "#/components/schemas/LimitApplicationType"
        fullName:
          type: string
        company:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        requestType:
          type: string
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TRY, USD, EUR, GBP]
        vehicleDetails:
          type: [string, "null"]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/LimitApplicationDocument"
        note:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/LimitApplicationStatus"
        internalNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LimitApplicationInput:
      type: object
      additionalProperties: false
      required:
        - fullName
        - applicationType
        - company
        - email
        - phone
        - requestType
        - amount
        - currency
        - documents
      properties:
        applicationType:
          $ref: "#/components/schemas/LimitApplicationType"
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        company:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        requestType:
          type: string
          enum:
            - İhtiyaç finansmanı
            - Eğitim finansmanı
            - Sağlık finansmanı
            - Konut alımı
            - Konut yenileme
            - Konut refinansmanı
            - İşletme sermayesi
            - Yatırım finansmanı
            - Ticari limit
            - Proje finansmanı
            - Otomobil
            - Ticari araç
            - İş makinesi
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TRY, USD, EUR, GBP]
        vehicleDetails:
          type: string
          maxLength: 2000
        documents:
          type: array
          minItems: 5
          maxItems: 6
          items:
            $ref: "#/components/schemas/LimitApplicationDocumentInput"
        note:
          type: string
          maxLength: 4000
    LimitApplicationStatusUpdate:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/LimitApplicationStatus"
        internalNote:
          type: string
          maxLength: 4000
    LimitApplicationType:
      type: string
      enum: [individual, commercial, housing, vehicle]
    LimitApplicationDocumentType:
      type: string
      enum:
        - personal_information
        - tax_certificate
        - signature_circular
        - kkb_report
        - findeks_report
        - ssk_service_statement
    LimitApplicationDocumentInput:
      type: object
      additionalProperties: false
      required: [documentType, objectPath, fileName, contentType, size]
      properties:
        documentType:
          $ref: "#/components/schemas/LimitApplicationDocumentType"
        objectPath:
          type: string
          pattern: "^/objects/uploads/[a-zA-Z0-9-]+$"
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        size:
          type: integer
          minimum: 1
          maximum: 10485760
    LimitApplicationDocument:
      allOf:
        - $ref: "#/components/schemas/LimitApplicationDocumentInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
    UploadUrlRequest:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    OrphanUploadCleanupRequest:
      type: object
      additionalProperties: false
      properties:
        dryRun:
          type: boolean
          default: false
          description: Adayları raporlar ancak silme işlemi yapmaz.
    OrphanUploadCleanupResponse:
      type: object
      required:
        - dryRun
        - retentionHours
        - cutoffAt
        - scannedObjects
        - referencedObjects
        - orphanedObjects
        - eligibleObjects
        - eligibleObjectPaths
        - deletedObjectPaths
        - skippedReferencedObjectPaths
        - failedObjects
      properties:
        dryRun:
          type: boolean
        retentionHours:
          type: integer
        cutoffAt:
          type: string
          format: date-time
        scannedObjects:
          type: integer
        referencedObjects:
          type: integer
        orphanedObjects:
          type: integer
        eligibleObjects:
          type: integer
        eligibleObjectPaths:
          type: array
          items:
            type: string
        deletedObjectPaths:
          type: array
          items:
            type: string
        skippedReferencedObjectPaths:
          type: array
          items:
            type: string
        failedObjects:
          type: array
          items:
            type: object
            required: [objectPath, error]
            properties:
              objectPath:
                type: string
              error:
                type: string
    ObjectDownloadUrlRequest:
      type: object
      additionalProperties: false
      required: [objectPath]
      properties:
        objectPath:
          type: string
          pattern: "^/objects/uploads/[a-zA-Z0-9-]+$"
          description: Başvuru belgesinin normalize edilmiş özel obje yolu.
    ObjectDownloadUrlResponse:
      type: object
      required: [downloadURL, expiresAt]
      properties:
        downloadURL:
          type: string
          format: uri
          description: Kısa süreli imzalı GET adresi.
        expiresAt:
          type: string
          format: date-time
          description: İmzalı adresin geçerliliğinin sona erdiği zaman.
    LimitApplicationPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LimitApplication"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
