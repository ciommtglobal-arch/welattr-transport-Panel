        "404":
          description: Approval item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workflow/notifications:
    get:
      operationId: getWorkflowNotifications
      tags: [workflow]
      summary: List in-app workflow notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowNotificationPage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workflow/notifications/{id}/read:
    patch:
      operationId: markWorkflowNotificationRead
      tags: [workflow]
      summary: Mark a workflow notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowNotification"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    TrialPage:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    TrialPageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
  schemas:
    KasaUser:
      type: object
      required: [id, name, role, branchId, active]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [admin, cashier] }
        branchId: { type: [integer, "null"] }
        active: { type: boolean }
    KasaAccess:
      type: object
      required: [user, canSetup, canManageInvoices, liveEnabled]
      properties:
        user: { oneOf: [{ $ref: "#/components/schemas/KasaUser" }, { type: "null" }] }
        canSetup: { type: boolean }
        canManageInvoices: { type: boolean }
        liveEnabled: { type: boolean }
    KasaBranch:
      type: object
      required: [id, name, active]
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }
    KasaBranchInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    KasaBranchUpdate:
      type: object
      additionalProperties: false
      required: [name, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        active: { type: boolean }
    KasaUserGrant:
      type: object
      additionalProperties: false
      required: [email, role, branchId]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, cashier] }
        branchId: { type: [integer, "null"], minimum: 1 }
    KasaUserUpdate:
      type: object
      additionalProperties: false
      required: [role, branchId, active]
      properties:
        role: { type: string, enum: [admin, cashier] }
        branchId: { type: [integer, "null"], minimum: 1 }
        active: { type: boolean }
    KasaRequestInput:
      type: object
      additionalProperties: false
      required: [amount, currency, branchId]
      properties:
        amount: { type: string, pattern: '^(0|[1-9]\d{0,7})(\.\d{1,2})?$' }
        currency: { type: string, enum: [TRY, EUR, USD] }
        branchId: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
    KasaRequestCancellationInput:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: { type: boolean, enum: [true] }
    KasaRequest:
      type: object
      required: [id, reference, amount, currency, branchId, cashierId, status, note, createdAt, cancelledAt, cancelledBy]
      properties:
        id: { type: integer }
        reference: { type: string }
        amount: { type: string }
        currency: { type: string, enum: [TRY, EUR, USD] }
        branchId: { type: integer }
        cashierId: { type: integer }
        status: { type: string, enum: [PENDING, COMPLETED, CANCELLED] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancelledBy: { type: [integer, "null"] }
    KasaPublicRequest:
      oneOf:
        - { $ref: "#/components/schemas/KasaActivePublicRequest" }
        - { $ref: "#/components/schemas/KasaCancelledPublicRequest" }
    KasaCancelledPublicRequest:
      type: object
      additionalProperties: false
      required: [status, liveEnabled]
      properties:
        status: { type: string, enum: [CANCELLED] }
        liveEnabled: { type: boolean, enum: [false] }
    KasaActivePublicRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, status, liveEnabled]
      properties:
        amount: { type: string }
        currency: { type: string, enum: [TRY, EUR, USD] }
        status: { type: string, enum: [PENDING, COMPLETED] }
        liveEnabled: { type: boolean }
    KasaCurrencyTotal:
      type: object
      required: [currency, revenue, pendingAmount, pendingCount, completedCount]
      properties:
        currency: { type: string, enum: [TRY, EUR, USD] }
        revenue: { type: string }
        pendingAmount: { type: string }
        pendingCount: { type: integer }
        completedCount: { type: integer }
    KasaSummary:
      type: object
      required: [totals, timezone, fiscalReport, liveEnabled]
      properties:
        totals: { type: array, items: { $ref: "#/components/schemas/KasaCurrencyTotal" } }
