components:
  schemas:
    TamiHostedPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, currency, fullName, email, phone, description]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000000
          description: Seçilen para birimindeki ödeme tutarı.
        currency:
          $ref: "#/components/schemas/PaymentCurrency"
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Masterpass doğrulaması için 905xxxxxxxxx formatına dönüştürülebilen telefon.
        description:
          type: string
          minLength: 2
          maxLength: 160
    TamiHostedPaymentSession:
      type: object
      required: [orderId, paymentUrl, status, currency, mode]
      properties:
        orderId:
          type: string
        paymentUrl:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/TamiPaymentStatusValue"
        currency:
          $ref: "#/components/schemas/PaymentCurrency"
        mode:
          $ref: "#/components/schemas/PaymentMode"
    TamiPaymentStatus:
      type: object
      required: [orderId, amount, currency, status]
      properties:
        orderId:
          type: string
        amount:
          type: number
        currency:
          $ref: "#/components/schemas/PaymentCurrency"
        status:
          $ref: "#/components/schemas/TamiPaymentStatusValue"
        providerPaymentStatus:
          type: [string, "null"]
        providerOrderStatus:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
    TamiPaymentStatusValue:
      type: string
      enum: [pending, success, failed]
    PaymentCurrency:
      type: string
      enum: [TRY, USD, EUR]
    PaymentMode:
      type: string
      enum: [mock, tami]
    MockPaymentResultInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [success, failed]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LimitApplicationStatus:
      type: string
      enum: [new, reviewing, approved, rejected]
    LimitApplication:
      type: object
      required:
        - id
        - referenceCode
        - applicationType
        - fullName
        - company
        - email
        - phone
        - requestType
        - amount
        - currency
        - documents
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        referenceCode:
          type: string
        applicationType:
          $ref: "#/components/schemas/LimitApplicationType"
        fullName:
          type: string
        company:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        requestType:
          type: string
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TRY, USD, EUR, GBP]
        vehicleDetails:
          type: [string, "null"]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/LimitApplicationDocument"
        note:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/LimitApplicationStatus"
        internalNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LimitApplicationInput:
      type: object
      additionalProperties: false
      required:
        - fullName
        - applicationType
        - company
        - email
        - phone
        - requestType
        - amount
        - currency
        - documents
      properties:
        applicationType:
          $ref: "#/components/schemas/LimitApplicationType"
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        company:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        requestType:
          type: string
          enum:
            - İhtiyaç finansmanı
            - Eğitim finansmanı
            - Sağlık finansmanı
            - Konut alımı
            - Konut yenileme
            - Konut refinansmanı
            - İşletme sermayesi
            - Yatırım finansmanı
            - Ticari limit
            - Proje finansmanı
            - Otomobil
            - Ticari araç
            - İş makinesi
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TRY, USD, EUR, GBP]
        vehicleDetails:
          type: string
          maxLength: 2000
        documents:
          type: array
          minItems: 5
          maxItems: 6
          items:
            $ref: "#/components/schemas/LimitApplicationDocumentInput"
        note:
          type: string
          maxLength: 4000
    LimitApplicationStatusUpdate:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/LimitApplicationStatus"
        internalNote:
          type: string
          maxLength: 4000
    LimitApplicationType:
      type: string
      enum: [individual, commercial, housing, vehicle]
    LimitApplicationDocumentType:
      type: string
      enum:
        - personal_information
        - tax_certificate
        - signature_circular
        - kkb_report
        - findeks_report
        - ssk_service_statement
    LimitApplicationDocumentInput:
      type: object
      additionalProperties: false
      required: [documentType, objectPath, fileName, contentType, size]
      properties:
        documentType:
          $ref: "#/components/schemas/LimitApplicationDocumentType"
        objectPath:
          type: string
          pattern: "^/objects/uploads/[a-zA-Z0-9-]+$"
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        size:
          type: integer
          minimum: 1
          maximum: 10485760
    LimitApplicationDocument:
      allOf:
        - $ref: "#/components/schemas/LimitApplicationDocumentInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
    UploadUrlRequest:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    OrphanUploadCleanupRequest:
      type: object
      additionalProperties: false
      properties:
        dryRun:
          type: boolean
          default: false
          description: Adayları raporlar ancak silme işlemi yapmaz.
    OrphanUploadCleanupResponse:
      type: object
      required:
        - dryRun
        - retentionHours
        - cutoffAt
        - scannedObjects
        - referencedObjects
        - orphanedObjects
        - eligibleObjects
        - eligibleObjectPaths
        - deletedObjectPaths
        - skippedReferencedObjectPaths
        - failedObjects
      properties:
        dryRun:
          type: boolean
        retentionHours:
          type: integer
        cutoffAt:
          type: string
          format: date-time
        scannedObjects:
          type: integer
        referencedObjects:
          type: integer
        orphanedObjects:
          type: integer
        eligibleObjects:
          type: integer
        eligibleObjectPaths:
          type: array
          items:
            type: string
        deletedObjectPaths:
          type: array
          items:
            type: string
        skippedReferencedObjectPaths:
          type: array
          items:
            type: string
        failedObjects:
          type: array
          items:
