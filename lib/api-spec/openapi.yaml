components:
  schemas:
    TamiHostedPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, currency, fullName, email, phone, description]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000000
          description: Seçilen para birimindeki ödeme tutarı.
        currency:
          $ref: "#/components/schemas/PaymentCurrency"
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Masterpass doğrulaması için 905xxxxxxxxx formatına dönüştürülebilen telefon.
        description:
          type: string
          minLength: 2
          maxLength: 160
    TamiHostedPaymentSession:
      type: object
      required: [orderId, paymentUrl, status, currency, mode]
      properties:
        orderId:
          type: string
        paymentUrl:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/TamiPaymentStatusValue"
        currency:
          $ref: "#/components/schemas/PaymentCurrency"
        mode:
          $ref: "#/components/schemas/PaymentMode"
    TamiPaymentStatus:
      type: object
      required: [orderId, amount, currency, status]
      properties:
        orderId:
          type: string
        amount:
          type: number
        currency:
          $ref: "#/components/schemas/PaymentCurrency"
        status:
          $ref: "#/components/schemas/TamiPaymentStatusValue"
        providerPaymentStatus:
          type: [string, "null"]
        providerOrderStatus:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
    TamiPaymentStatusValue:
      type: string
      enum: [pending, success, failed]
    PaymentCurrency:
      type: string
      enum: [TRY, USD, EUR]
    PaymentMode:
      type: string
      enum: [mock, tami]
    PaymentReadiness:
      type: object
      additionalProperties: false
      required:
        - bankAccountVerified
        - providerApproved
        - liveEnabled
        - cardDataCollected
      properties:
        bankAccountVerified:
          type: boolean
        providerApproved:
          type: boolean
        liveEnabled:
          type: boolean
        cardDataCollected:
          type: boolean
    PaymentCheckoutInput:
      type: object
      additionalProperties: false
      required: [invoiceReference, amount, currency, description]
      properties:
        invoiceReference:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          type: string
          pattern: '^\d{1,9}(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TRY, EUR, USD]
        description:
          type: string
          minLength: 1
          maxLength: 240
    PaymentCheckoutSession:
      type: object
      additionalProperties: false
      required: [checkoutUrl, paymentReference]
      properties:
        checkoutUrl:
          type: string
          format: uri
          description: Hosted URL returned by the licensed provider; never a card form hosted by MMT
        paymentReference:
          type: string
    MockPaymentResultInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [success, failed]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StaffProfileStatus:
      type: string
      enum: [draft, verified, archived]
    StaffProfile:
      type: object
      required:
        - id
        - internalId
        - fullName
        - proposedRole
        - profileStatus
        - languages
        - educationSummary
        - businessSummary
        - supportRequested
        - publicVisibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        internalId:
          type: string
        fullName:
          type: string
        contactEmail:
          type: [string, "null"]
          format: email
        proposedRole:
          type: string
        profileStatus:
          $ref: "#/components/schemas/StaffProfileStatus"
        languages:
          type: array
          items:
            type: string
        educationSummary:
          type: string
        businessSummary:
          type: string
        additionalResponsibility:
          type: [string, "null"]
        approvalRequired:
          type: boolean
        supportRequested:
          type: boolean
        supportNote:
          type: [string, "null"]
        publicVisibility:
          type: boolean
        verificationNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OperationsDesk:
      type: object
      required:
        - deskCode
        - deskTitle
        - assignedTo
        - role
        - accountEmail
        - responsibilities
        - boundaries
      properties:
        deskCode:
          type: string
        deskTitle:
          type: string
        assignedTo:
          type: string
        role:
          type: string
        accountEmail:
          type: string
          format: email
        responsibilities:
          type: array
          items:
            type: string
        boundaries:
          type: array
          items:
            type: string
    StaffRewardPlanStatus:
      type: string
      enum: [draft, active, paused]
    StaffRewardTransactionKind:
      type: string
      enum: [points, cash, holiday_package, international_trip]
    StaffRewardTransactionStatus:
      type: string
      enum: [approved, pending_approval, rejected]
    StaffRewardPlanInput:
      type: object
      additionalProperties: false
      required: [staffEmail, name]
      properties:
        staffEmail:
          type: string
          format: email
        name:
          type: string
          minLength: 2
          maxLength: 160
        monthlyPoints:
          type: integer
          minimum: 0
          maximum: 1000000
        monthlyCashAmount:
          type: number
          minimum: 0
        currency:
          type: string
