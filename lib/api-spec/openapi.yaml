    CompanyFundInput:
      type: object
      additionalProperties: false
      required: [islem_turu, miktar, para_birimi, kurum, istek_anahtari]
      properties:
        islem_turu: { type: string, minLength: 2, maxLength: 100 }
        miktar:
          type: string
          maxLength: 15
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
          description: Positive exact decimal, at most 999999999999.99; zero rejected. String prevents binary floating-point precision loss.
        para_birimi: { type: string, enum: [TRY, EUR, USD] }
        kurum: { type: string, minLength: 2, maxLength: 200 }
        aciklama: { type: string, maxLength: 8000, default: "" }
        istek_anahtari: { type: string, format: uuid, description: Keep the same UUID when retrying the same draft }
    CompanyFundAmendmentInput:
      type: object
      additionalProperties: false
      required: [tur, gerekce, istek_anahtari]
      properties:
        tur: { type: string, enum: [duzeltme, iptal] }
        gerekce: { type: string, minLength: 5, maxLength: 2000 }
        istek_anahtari: { type: string, format: uuid }
        yeni_kayit:
          $ref: "#/components/schemas/CompanyFundReplacementInput"
      description: Correction requires yeni_kayit; cancellation forbids it. No caller attribution/company/date accepted.
    CompanyFundReplacementInput:
      type: object
      additionalProperties: false
      required: [islem_turu, miktar, para_birimi, kurum]
      properties:
        islem_turu: { type: string, minLength: 2, maxLength: 100 }
        miktar: { type: string, maxLength: 15, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$' }
        para_birimi: { type: string, enum: [TRY, EUR, USD] }
        kurum: { type: string, minLength: 2, maxLength: 200 }
        aciklama: { type: string, maxLength: 8000, default: "" }
    CompanyFundAmendment:
      type: object
      required: [id, onceki_kayit_id, yeni_kayit_id, tur, gerekce, zaman, olusturan]
      properties:
        id: { type: integer }
        onceki_kayit_id: { type: integer }
        yeni_kayit_id: { type: [integer, "null"] }
        tur: { type: string, enum: [duzeltme, iptal] }
        gerekce: { type: string }
        zaman: { type: string, format: date-time }
        olusturan: { type: string }
    CompanyFundRecord:
      type: object
      required: [id, islem_turu, miktar, para_birimi, kurum, aciklama, imza, ekosistem, kayit_durumu, zaman, olusturan, guncel_durum, duzeltmeler]
      properties:
        id: { type: integer }
        islem_turu: { type: string }
        miktar: { type: string, description: Exact decimal with two fraction digits }
        para_birimi: { type: string, enum: [TRY, EUR, USD] }
        kurum: { type: string }
        aciklama: { type: string }
        imza: { type: string, description: Attribution label, not a digital signature }
        ekosistem: { type: string, description: Classification label, not financial assurance }
        kayit_durumu: { type: string, enum: [firma_ici_kayit] }
        zaman: { type: string, format: date-time }
        olusturan: { type: string }
        guncel_durum: { type: string, enum: [guncel, yerine_gecmis, iptal] }
