openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: limit-applications
    description: Corporate limit application operations
  - name: Storage
    description: Özel başvuru belgeleri için güvenli depolama işlemleri
  - name: payments
    description: Test ve Tami hosted ödeme işlemleri
  - name: b2b-listings
    description: Moderated free B2B listing operations
  - name: b2b-businesses
    description: Verified business profile and B2B network operations
  - name: media
    description: MMT Global personel medya merkezi işlemleri
paths:
  /payments/tami/hosted-session:
    post:
      operationId: createTamiHostedPaymentSession
      tags: [payments]
      summary: Kart bilgilerini MMT sistemine almadan ödeme oturumu oluşturur
      description: |
        PAYMENT_MODE=mock olduğunda gerçek tahsilat yapmadan test ödeme sayfası
        üretir. Canlı sağlayıcı modunda kart numarası ve güvenlik kodu bu API'ye
        gönderilmez; müşteri sağlayıcının hosted ödeme sayfasına yönlendirilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TamiHostedPaymentInput"
      responses:
        "201":
          description: Hosted ödeme oturumu oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiHostedPaymentSession"
        "400":
          description: Geçersiz ödeme isteği.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Canlı ödeme entegrasyonu yapılandırılmamış.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Canlı ödeme sağlayıcısı yanıt vermedi veya hatalı yanıt verdi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/tami/{orderId}:
    get:
      operationId: getTamiPaymentStatus
      tags: [payments]
      summary: Ödeme durumunu sorgular
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 36
      responses:
        "200":
          description: Ödeme durumu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiPaymentStatus"
        "404":
          description: Ödeme oturumu bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Canlı ödeme entegrasyonu yapılandırılmamış.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Canlı ödeme sorgu servisi yanıt vermedi veya hatalı yanıt verdi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/mock/{orderId}/result:
    post:
      operationId: setMockPaymentResult
      tags: [payments]
      summary: Test ödeme sonucunu başarı veya başarısızlık olarak simüle eder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockPaymentResultInput"
      responses:
        "200":
          description: Test ödeme sonucu kaydedildi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiPaymentStatus"
        "400":
          description: Geçersiz test ödeme sonucu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ödeme oturumu bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Test ödeme modu aktif değil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/request-download-url:
    post:
      tags: [Storage]
      operationId: requestObjectDownloadUrl
      summary: Başvuru belgesi için kısa süreli imzalı okuma adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectDownloadUrlRequest"
      responses:
        "200":
          description: İmzalı okuma adresi oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDownloadUrlResponse"
        "400":
          description: Geçersiz obje yolu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Belge bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: İmzalı okuma adresi oluşturulamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Başvuru belgesi için güvenli yükleme adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Yükleme adresi oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Geçersiz dosya bilgisi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Yükleme adresi oluşturulamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/cleanup-orphans:
    post:
      tags: [Storage]
      operationId: cleanupOrphanUploads
      summary: Başvuruya bağlanmayan eski yüklemeleri raporlar veya temizler
      description: |
        Zamanlanmış bakım işi tarafından çağrılmak üzere tasarlanmıştır.
        Varsayılan saklama süresi 24 saattir ve ORPHAN_UPLOAD_RETENTION_HOURS
        ortam değişkeniyle artırılabilir. Yalnızca admin ve operations personeli
        çağırabilir. dryRun true olduğunda hiçbir obje silinmez.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanUploadCleanupRequest"
      responses:
        "200":
          description: Temizlik özeti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanUploadCleanupResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin or operations access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Geçersiz temizlik isteği.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Temizlik gerçekleştirilemedi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items:
    get:
      operationId: getMediaItems
      tags: [media]
      summary: Personel medya merkezi kayıtlarını listeler
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/MediaItemStatus"
        - in: query
          name: query
          schema:
            type: string
            maxLength: 120
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        "200":
          description: Personel medya kayıtları
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemPage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createMediaItem
      tags: [media]
      summary: Personel medya merkezi kaydı oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaItemInput"
      responses:
        "201":
          description: Medya kaydı oluşturuldu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "400":
          description: Geçersiz medya bilgisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items/{id}:
    patch:
      operationId: updateMediaItem
      tags: [media]
      summary: Personel medya merkezi kaydını günceller
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaItemUpdate"
      responses:
        "200":
          description: Medya kaydı güncellendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "400":
          description: Geçersiz medya güncellemesi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Medya kaydı bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items/{id}/download-url:
    post:
      operationId: requestMediaItemDownloadUrl
      tags: [media]
      summary: Personel medya dosyası için kısa süreli indirme adresi oluşturur
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Kısa süreli indirme adresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDownloadUrlResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Medya dosyası bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/uploads/request-url:
    post:
      operationId: requestMediaUploadUrl
      tags: [media]
      summary: Personel medya dosyası için güvenli yükleme adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadUrlRequest"
      responses:
        "200":
          description: Güvenli yükleme adresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadUrlResponse"
        "400":
          description: Geçersiz medya dosyası
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Yükleme adresi oluşturulamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /limit-applications:
    post:
      operationId: createLimitApplication
      tags: [limit-applications]
      summary: Submit a limit application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplication"
        "400":
          description: Invalid application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getLimitApplications
      tags: [limit-applications]
      summary: List limit applications for authorized staff
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/LimitApplicationStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Applications page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplicationPage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /limit-applications/{id}/status:
    patch:
      operationId: updateLimitApplicationStatus
      tags: [limit-applications]
      summary: Update an application status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitApplicationStatusUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplication"
        "400":
          description: Invalid status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b/business-profile/me:
    get:
      operationId: getMyB2BBusinessProfile
      tags: [b2b-businesses]
      summary: Get the signed-in user's B2B business profile
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BBusinessProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMyB2BBusinessProfile
      tags: [b2b-businesses]
      summary: Create a business profile for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2BBusinessProfileInput"
      responses:
        "201":
          description: Business profile submitted for verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BBusinessProfile"
        "400":
          description: Invalid business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Business profile already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b/business-profile/verification-upload-url:
    post:
      operationId: requestB2BBusinessVerificationUploadUrl
      tags: [b2b-businesses]
      summary: Request a protected upload URL for a business verification document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upload URL could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b/business-profiles/review:
    get:
      operationId: getB2BBusinessProfileReviewQueue
      tags: [b2b-businesses]
      summary: List business profiles for staff verification
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/B2BBusinessProfileStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Business profiles for verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BBusinessProfilePage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b/business-profiles/{id}/status:
    patch:
      operationId: updateB2BBusinessProfileStatus
      tags: [b2b-businesses]
      summary: Verify, reject, or suspend a business profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2BBusinessProfileStatusUpdate"
      responses:
        "200":
          description: Updated business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BBusinessProfile"
        "400":
          description: Invalid status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b-listings/image-upload-url:
    post:
      operationId: requestB2BListingImageUploadUrl
      tags: [b2b-listings]
      summary: Create an upload URL for a B2B listing cover image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2BListingImageUploadInput"
      responses:
        "200":
          description: Listing image upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A verified business profile is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b-listings:
    get:
      operationId: getB2BListings
      tags: [b2b-listings]
      summary: List approved B2B listings
      parameters:
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/B2BListingRole"
        - in: query
          name: query
          schema:
            type: string
            maxLength: 120
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Approved B2B listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BListingPage"
        "400":
          description: Invalid listing filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createB2BListing
      tags: [b2b-listings]
      summary: Submit a B2B listing for moderation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2BListingInput"
      responses:
        "201":
          description: Listing submitted for moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BListing"
        "400":
          description: Invalid listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b-listings/review:
    get:
      operationId: getB2BListingReviewQueue
      tags: [b2b-listings]
      summary: List B2B listings for authorized staff review
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/B2BListingStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: B2B listings for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BListingPage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /b2b-listings/{id}:
    get:
      operationId: getB2BListing
      tags: [b2b-listings]
      summary: Get an approved B2B listing
      parameters:
        - in: path
          name: id
          required: true
