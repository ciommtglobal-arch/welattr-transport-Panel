openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: limit-applications
    description: Corporate limit application operations
  - name: Storage
    description: Özel başvuru belgeleri için güvenli depolama işlemleri
  - name: payments
    description: MMT hizmet faturaları için sağlayıcı ödemesi; Shopify kapsam dışıdır
  - name: b2b-listings
    description: Moderated free B2B listing operations
  - name: b2b-businesses
    description: Verified business profile and B2B network operations
  - name: media
    description: MMT Global personel medya merkezi işlemleri
  - name: logistics-operations
    description: Lojistik talep, taşıyıcı ve operasyon yönetimi
  - name: staff-profiles
    description: Giriş yapmış personel için iç ekip profil taslakları
  - name: staff-trial
    description: Founder-allowlisted, nonproduction trial candidate access, tasks and reports
  - name: storefront
    description: Shopify buyer catalog and cart; checkout blocked pending merchant verification
paths:
  /celik-kubbe/fon-islem:
    post:
      operationId: createCompanyFundRecord
      tags: [b2b-businesses]
      description: Owner-only internal record, never a loan approval or money transfer. UUID request key makes retries idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyFundInput" }
      responses:
        "201":
          description: Saved or original matching record returned on retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyFundResult" }
        "400": { description: "Invalid amount, currency, fields or request key" }
        "401": { description: Sign-in required }
        "403": { description: Active company owner required }
        "409": { description: Request key already used for different input }
        "503": { description: Database unavailable; retry with the same request key }
  /celik-kubbe/fon-islem/{id}/duzeltmeler:
    post:
      operationId: createCompanyFundAmendment
      tags: [b2b-businesses]
      description: Active firm owner appends a reasoned correction or cancellation. Originals never change. No bank, loan or Kasa QR action.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyFundAmendmentInput" }
      responses:
        "201":
          description: Amendment saved or matching retry returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyFundAmendment" }
        "400": { description: Invalid input or protected fields }
        "401": { description: Sign-in required }
        "403": { description: Active firm owner required }
        "404": { description: Record not found in this company }
        "409": { description: Record already superseded/cancelled or request key reused }
        "503": { description: Storage unavailable; retry same draft/key }
  /celik-kubbe/talimat-ekle:
    post:
      operationId: createCompanyInstructionAlias
      tags: [b2b-businesses]
      description: Alias for the existing owner-only internal instruction creation; caller-supplied yetkili rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInstructionInput" }
      responses:
        "201":
          description: Saved in the same instruction table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyInstructionResult" }
        "400": { description: Invalid or protected input }
        "401": { description: Sign-in required }
        "403": { description: Active company owner required }
  /celik-kubbe/durum:
    get:
      operationId: getCompanyRecordStatus
      tags: [b2b-businesses]
      description: Private company-scoped counts and independently paginated internal record lists.
      parameters:
        - { in: query, name: fon_limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: fon_offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { in: query, name: talimat_limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: talimat_offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        "200":
          description: Only authenticated company data, no financial guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyRecordStatus" }
        "400": { description: Invalid pagination or extra company selector }
        "401": { description: Sign-in required }
        "403": { description: Active owner/admin/manager required }
        "503": { description: Database unavailable }
  /talimat-ekle:
    post:
      operationId: createCompanyInstruction
      tags: [b2b-businesses]
      description: Owner-only internal record; not a digital signature or external dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInstructionInput" }
      responses:
        "201":
          description: Saved within the authenticated company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyInstructionResult" }
        "400": { description: Invalid input }
        "401": { description: Sign-in required }
        "403": { description: Company owner required }
  /talimatlari-listele:
    get:
      operationId: getCompanyInstructions
      tags: [b2b-businesses]
      description: Active owner/admin/manager may read only their own company records.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
      responses:
        "200":
          description: Company-scoped instruction page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyInstructionPage" }
        "400": { description: Invalid pagination }
        "401": { description: Sign-in required }
        "403": { description: Company management access required }
  /kasa/me:
    get:
      operationId: getKasaMe
      responses:
        "200":
          description: Kasa access only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaAccess" }
        "401": { description: Login required }
  /kasa/service-invoices:
    get:
      operationId: getKasaServiceInvoices
      summary: Hizmet faturalarını listeler; yalnızca uygulama sahibi erişebilir
      responses:
        "200":
          description: Kalıcı hizmet faturaları
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceInvoice" }
        "401": { description: Sign-in required }
        "403": { description: App owner required }
    post:
      operationId: createKasaServiceInvoice
      summary: Yeni hizmet faturası düzenler
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInvoiceInput" }
      responses:
        "201":
          description: Issued service invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceInvoice" }
        "400": { description: Invalid invoice data }
        "401": { description: Sign-in required }
        "403": { description: App owner required }
  /kasa/service-invoices/{id}/cancel:
    post:
      operationId: cancelKasaServiceInvoice
      summary: Ödenmemiş faturayı geçmişi silmeden iptal eder
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Cancelled service invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceInvoice" }
        "401": { description: Sign-in required }
        "403": { description: App owner required }
        "404": { description: Invoice not found }
        "409": { description: Paid or payment-in-progress invoice cannot be cancelled }
  /kasa/setup:
    post:
      operationId: setupKasaOwner
      responses:
        "200":
          description: Explicit allowlisted owner setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaUser" }
        "403": { description: Owner allowlist required }
  /kasa/branches:
    get:
      operationId: getKasaBranches
      responses:
        "200":
          description: Accessible branches
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KasaBranch" } }
    post:
      operationId: createKasaBranch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaBranchInput" }
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaBranch" }
  /kasa/branches/{id}:
    patch:
      operationId: updateKasaBranch
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaBranchUpdate" }
      responses:
        "200":
          description: Branch updated without removing history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaBranch" }
  /kasa/users:
    get:
      operationId: getKasaUsers
      responses:
        "200":
          description: Admin-only members
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KasaUser" } }
    post:
      operationId: grantKasaUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaUserGrant" }
      responses:
        "201":
          description: Verified existing Clerk account assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaUser" }
  /kasa/users/{id}:
    patch:
      operationId: updateKasaUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaUserUpdate" }
      responses:
        "200":
          description: Role and branch updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaUser" }
  /kasa/requests:
    get:
      operationId: getKasaRequests
      parameters:
        - { in: query, name: branchId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: date, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Own requests for cashier; all for admin
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KasaRequest" } }
    post:
      operationId: createKasaRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaRequestInput" }
      responses:
        "201":
          description: Pending request, never payment fulfillment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaRequest" }
  /kasa/requests/{id}:
    get:
      operationId: getKasaRequest
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Authorized request details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaRequest" }
        "404": { description: Not found or not owned }
  /kasa/requests/{id}/cancel:
    post:
      operationId: cancelKasaRequest
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaRequestCancellationInput" }
      responses:
        "200":
          description: Pending request cancelled; original history and amount preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaRequest" }
        "400": { description: Explicit confirmation required }
        "401": { description: Sign-in required }
        "403": { description: Inactive membership or invalid origin }
        "404": { description: Not found or not owned }
        "409": { description: Request no longer pending or has collection evidence }
  /kasa/public/{reference}:
    get:
      operationId: getKasaPublicRequest
      parameters:
        - { in: path, name: reference, required: true, schema: { type: string, minLength: 32, maxLength: 64 } }
      responses:
        "200":
          description: Minimal read-only request; no identities or private notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaPublicRequest" }
        "404": { description: Unknown request }
  /kasa/summary:
    get:
      operationId: getKasaSummary
      parameters:
        - { in: query, name: branchId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: date, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Admin-only completed verified revenue by currency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaSummary" }
        "403": { description: Admin required }
  /kasa/summary/export:
    get:
      operationId: exportKasaSummary
      description: Active Kasa administrators only. Fresh server-calculated summary, never a fiscal Z report or cash balance. Decimal amounts remain strings; currencies are not combined. Downloads are not stored publicly.
      parameters:
        - { in: query, name: branchId, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
        - { in: query, name: date, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: Europe/Istanbul day. Completed revenue uses completedAt; pending requests use createdAt. Omit for all days. }
        - { in: query, name: format, required: true, schema: { type: string, enum: [csv, html] } }
      responses:
        "200":
          description: UTF-8 CSV (BOM, formula-safe cells) or self-contained printable HTML attachment
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            text/csv:
              schema: { type: string, format: binary }
            text/html:
              schema: { type: string, format: binary }
        "400": { description: "Invalid date, branch or format" }
        "401": { description: Sign-in required }
        "403": { description: Active Kasa administrator required }
        "404": { description: Branch not found }
  /staff/trial-candidates:
    get:
      operationId: getStaffTrialCandidates
      tags: [staff-trial]
      summary: Founder lists trial grants with verified email for identification
      parameters:
        - $ref: "#/components/parameters/TrialPage"
        - $ref: "#/components/parameters/TrialPageSize"
      responses:
        "200":
          description: Minimal, paginated candidate list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialCandidatePage" }
        "401": { description: Authentication required }
        "403": { description: Founder allowlist required }
    post:
      operationId: createStaffTrialCandidate
      tags: [staff-trial]
      summary: Founder grants trial access to an existing Clerk account
      description: Server looks up the exact email in Clerk and grants only a single existing account with that verified email; does not create or promote an account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffTrialCandidateInput" }
      responses:
        "201":
          description: Trial grant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialCandidate" }
        "400": { description: "Extra input, no account, ambiguous email, or unverified email" }
        "401": { description: Authentication required }
        "403": { description: Founder allowlist required }
        "409": { description: Trial record exists or target has an active staff_users account }
        "502": { description: Clerk account could not be verified }
  /staff/trial-candidates/{clerkUserId}/active:
    patch:
      operationId: updateStaffTrialCandidateActive
      tags: [staff-trial]
      summary: Founder activates or revokes a trial-only grant
      parameters:
        - in: path
          name: clerkUserId
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffTrialCandidateActiveUpdate" }
      responses:
        "200":
          description: Updated trial grant; no staff role is changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialCandidate" }
        "401": { description: Authentication required }
        "403": { description: Founder allowlist required }
        "404": { description: Trial candidate not found }
  /staff/trial-tasks:
    get:
      operationId: getStaffTrialTasks
      tags: [staff-trial]
      summary: Active candidate lists only their own trial tasks
      parameters:
        - $ref: "#/components/parameters/TrialPage"
        - $ref: "#/components/parameters/TrialPageSize"
      responses:
        "200":
          description: Candidate-owned task page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialTaskPage" }
        "401": { description: Authentication required }
        "403": { description: Active trial grant required }
    post:
      operationId: createStaffTrialTask
      tags: [staff-trial]
      summary: Founder assigns a task to an active trial candidate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffTrialTaskInput" }
      responses:
        "201":
          description: Trial task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialTask" }
        "400": { description: Candidate has no active trial grant }
        "401": { description: Authentication required }
        "403": { description: Founder allowlist required }
  /staff/trial-tasks/{id}:
    patch:
      operationId: updateStaffTrialTask
      tags: [staff-trial]
      summary: Candidate updates only their own trial task progress and result
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffTrialTaskUpdate" }
      responses:
        "200":
          description: Updated own task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialTask" }
        "400": { description: Completed task must retain a nonempty final resultText }
        "401": { description: Authentication required }
        "403": { description: Active trial grant required }
        "404": { description: Task not found or not owned }
  /staff/trial-tasks/{id}/reports:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getStaffTrialTaskReports
      tags: [staff-trial]
      summary: Candidate reads reports for their own task
      parameters:
        - $ref: "#/components/parameters/TrialPage"
        - $ref: "#/components/parameters/TrialPageSize"
      responses:
        "200":
          description: Own task reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialReportPage" }
        "401": { description: Authentication required }
        "403": { description: Active trial grant required }
        "404": { description: Task not found or not owned }
    post:
      operationId: createStaffTrialReport
      tags: [staff-trial]
      summary: Candidate appends a nonempty report to their own task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffTrialReportInput" }
      responses:
        "201":
          description: Report appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialReport" }
        "400": { description: Invalid or empty report }
        "401": { description: Authentication required }
        "403": { description: Active trial grant required }
        "404": { description: Task not found or not owned }
  /staff/trial-candidates/{clerkUserId}/tasks:
    get:
      operationId: getStaffTrialCandidateTasks
      tags: [staff-trial]
      summary: Founder reviews candidate task status, results and support details
      parameters:
        - in: path
          name: clerkUserId
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - $ref: "#/components/parameters/TrialPage"
        - $ref: "#/components/parameters/TrialPageSize"
      responses:
        "200":
          description: Paginated trial tasks and results with founder-only candidate identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialCandidateTaskReviewPage" }
        "401": { description: Authentication required }
        "403": { description: Founder allowlist required }
        "404": { description: Trial candidate not found }
  /staff/trial-candidates/{clerkUserId}/reports:
    get:
      operationId: getStaffTrialCandidateReports
      tags: [staff-trial]
      summary: Founder reads a candidate's paginated trial reports
      parameters:
        - in: path
          name: clerkUserId
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - $ref: "#/components/parameters/TrialPage"
        - $ref: "#/components/parameters/TrialPageSize"
      responses:
        "200":
          description: Candidate reports with founder-only verified email; report author email and unrelated profile data are not included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialCandidateReportReviewPage" }
        "401": { description: Authentication required }
        "403": { description: Founder allowlist required }
        "404": { description: Trial candidate not found }
  /staff/trial-candidates/{clerkUserId}/evaluation:
    patch:
      operationId: updateStaffTrialCandidateEvaluation
      tags: [staff-trial]
      summary: Founder saves private evaluation notes without promoting candidate
      parameters:
        - in: path
          name: clerkUserId
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffTrialCandidateEvaluationUpdate" }
      responses:
        "200":
          description: Private note saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffTrialCandidate" }
        "401": { description: Authentication required }
        "403": { description: Founder allowlist required }
        "404": { description: Trial candidate not found }
  /payments/tami/{orderId}:
    get:
      operationId: getTamiPaymentStatus
      tags: [payments]
      summary: Ödeme durumunu sorgular
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 36
      responses:
        "200":
          description: Ödeme durumu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiPaymentStatus"
        "404":
          description: Ödeme oturumu bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Canlı ödeme entegrasyonu yapılandırılmamış.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Canlı ödeme sorgu servisi yanıt vermedi veya hatalı yanıt verdi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/tami/{orderId}/reconcile:
    post:
      operationId: reconcileTamiPayment
      tags: [payments]
      summary: İmzalı sağlayıcı yanıtıyla ödeme ve iade kayıtlarını mutabık kılar
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, minLength: 2, maxLength: 36 }
      responses:
        "200":
          description: Verified provider state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TamiPaymentStatus" }
        "401": { description: Sign-in required }
        "403": { description: App owner required }
        "404": { description: Payment session not found }
        "502": { description: Provider response could not be verified }
        "503": { description: Provider reconciliation is not configured }
  /payments/tami/{orderId}/refunds:
    post:
      operationId: createTamiPaymentRefund
      tags: [payments]
      summary: Sahibin onaylı hizmet ödemesi için iade başlatır
      description: |
        İmzası doğrulanamayan yanıt pending kalır. Bekleyen iade varken yeni
        sağlayıcı isteği gönderilmez; önce mutabakat yapılmalıdır.
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, minLength: 2, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentRefundInput" }
      responses:
        "201":
          description: Refund state recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRefund" }
        "400": { description: Invalid or excessive refund amount }
        "401": { description: Sign-in required }
        "403": { description: App owner required }
        "404": { description: Payment session not found }
        "409": { description: "Refund key conflict, pending refund, or payment not refundable" }
        "502": { description: Ambiguous provider result; reconcile before retrying }
        "503": { description: Provider refund is not configured }
    get:
      operationId: getTamiPaymentRefunds
