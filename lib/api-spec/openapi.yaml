openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: limit-applications
    description: Corporate limit application operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /limit-applications:
    post:
      operationId: createLimitApplication
      tags: [limit-applications]
      summary: Submit a limit application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplication"
        "400":
          description: Invalid application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getLimitApplications
      tags: [limit-applications]
      summary: List limit applications for authorized staff
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/LimitApplicationStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Applications page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplicationPage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /limit-applications/{id}/status:
    patch:
      operationId: updateLimitApplicationStatus
      tags: [limit-applications]
      summary: Update an application status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitApplicationStatusUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitApplication"
        "400":
          description: Invalid status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LimitApplicationStatus:
      type: string
      enum: [new, reviewing, approved, rejected]
    LimitApplication:
      type: object
      required:
        - id
        - referenceCode
        - applicationType
        - fullName
        - company
        - email
        - phone
        - requestType
        - amount
        - currency
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        referenceCode:
          type: string
        applicationType:
          $ref: "#/components/schemas/LimitApplicationType"
        fullName:
          type: string
        company:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        requestType:
          type: string
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TRY, USD, EUR, GBP]
        note:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/LimitApplicationStatus"
        internalNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LimitApplicationInput:
      type: object
      additionalProperties: false
      required:
        - fullName
        - applicationType
        - company
        - email
        - phone
        - requestType
        - amount
        - currency
      properties:
        applicationType:
          $ref: "#/components/schemas/LimitApplicationType"
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        company:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        requestType:
          type: string
          enum:
            - İhtiyaç finansmanı
            - Eğitim finansmanı
            - Sağlık finansmanı
            - Konut alımı
            - Konut yenileme
            - Konut refinansmanı
            - İşletme sermayesi
            - Yatırım finansmanı
            - Ticari limit
            - Proje finansmanı
            - Otomobil
            - Ticari araç
            - İş makinesi
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TRY, USD, EUR, GBP]
        note:
          type: string
          maxLength: 4000
    LimitApplicationStatusUpdate:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/LimitApplicationStatus"
        internalNote:
          type: string
          maxLength: 4000
    LimitApplicationType:
      type: string
      enum: [individual, commercial, housing, vehicle]
    LimitApplicationPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LimitApplication"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

