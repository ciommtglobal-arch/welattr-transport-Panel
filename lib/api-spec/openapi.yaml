      enum: [company_task, company_request, business_profile, limit_application, b2b_listing, b2b_request, b2b_report, media_item, media_delivery, logistics_offer]
    WorkflowRiskCategory:
      type: string
      enum: [none, financial, legal, external, delete, permission]
    WorkflowApprovalStatus:
      type: string
      enum: [pending_reviewer, pending_owner, auto_approved, approved, rejected, expired]
    WorkflowNotificationType:
      type: string
      enum: [approval, risk, deadline, rating]
    WorkflowApprovalInput:
      type: object
      additionalProperties: false
      required: [entityType, entityId, title]
      properties:
        entityType:
          $ref: "#/components/schemas/WorkflowEntityType"
        entityId:
          type: integer
        title:
          type: string
          minLength: 2
          maxLength: 200
        summary:
          type: string
          maxLength: 4000
        riskCategory:
          $ref: "#/components/schemas/WorkflowRiskCategory"
        riskReason:
          type: string
          maxLength: 1000
    WorkflowApproval:
      type: object
      required: [id, entityType, entityId, title, summary, riskCategory, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        businessProfileId:
          type: [integer, "null"]
        entityType:
          $ref: "#/components/schemas/WorkflowEntityType"
        entityId:
          type: integer
        title:
          type: string
        summary:
          type: string
        submittedByClerkUserId:
          type: [string, "null"]
        ownerClerkUserId:
          type: [string, "null"]
        reviewerClerkUserId:
          type: [string, "null"]
        riskCategory:
          $ref: "#/components/schemas/WorkflowRiskCategory"
        riskReason:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/WorkflowApprovalStatus"
        reviewerDecisionAt:
          type: [string, "null"]
          format: date-time
        ownerDecisionAt:
          type: [string, "null"]
          format: date-time
        decisionDueAt:
          type: [string, "null"]
          format: date-time
        autoDecisionAt:
          type: [string, "null"]
          format: date-time
        decisionNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowReviewerDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 4000
    WorkflowOwnerDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 4000
    WorkflowNotification:
      type: object
      required: [id, type, title, body, readAt, createdAt]
      properties:
        id:
          type: integer
        type:
          $ref: "#/components/schemas/WorkflowNotificationType"
        title:
          type: string
        body:
          type: string
        approvalId:
          type: [integer, "null"]
        readAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    WorkflowApprovalPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowApproval"
        total:
          type: integer
    WorkflowNotificationPage:
      type: object
      required: [items, total, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNotification"
        total:
          type: integer
        unreadCount:
          type: integer
