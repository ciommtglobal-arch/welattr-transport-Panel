openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: limit-applications
    description: Corporate limit application operations
  - name: Storage
    description: Özel başvuru belgeleri için güvenli depolama işlemleri
  - name: payments
    description: Şimdilik yalnızca test ödeme akışı; canlı sağlayıcı kodu devre dışı
  - name: b2b-listings
    description: Moderated free B2B listing operations
  - name: b2b-businesses
    description: Verified business profile and B2B network operations
  - name: media
    description: MMT Global personel medya merkezi işlemleri
  - name: logistics-operations
    description: Lojistik talep, taşıyıcı ve operasyon yönetimi
  - name: staff-profiles
    description: Giriş yapmış personel için iç ekip profil taslakları
paths:
  /payments/tami/hosted-session:
    post:
      operationId: createTamiHostedPaymentSession
      tags: [payments]
      summary: Kart bilgilerini MMT sistemine almadan ödeme oturumu oluşturur
      description: |
        Canlı tahsilat kapalıdır; ortam ayarından bağımsız olarak gerçek ödeme
        almadan test ödeme sayfası üretir. Kart numarası ve güvenlik kodu bu API'ye
        gönderilmez. Canlıya geçiş ayrıca onaylanmalıdır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TamiHostedPaymentInput"
      responses:
        "201":
          description: Hosted ödeme oturumu oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiHostedPaymentSession"
        "400":
          description: Geçersiz ödeme isteği.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Canlı ödeme entegrasyonu yapılandırılmamış.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Canlı ödeme sağlayıcısı yanıt vermedi veya hatalı yanıt verdi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/tami/{orderId}:
    get:
      operationId: getTamiPaymentStatus
      tags: [payments]
      summary: Ödeme durumunu sorgular
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 36
      responses:
        "200":
          description: Ödeme durumu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiPaymentStatus"
        "404":
          description: Ödeme oturumu bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Canlı ödeme entegrasyonu yapılandırılmamış.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Canlı ödeme sorgu servisi yanıt vermedi veya hatalı yanıt verdi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/mock/{orderId}/result:
    post:
      operationId: setMockPaymentResult
      tags: [payments]
      summary: Test ödeme sonucunu başarı veya başarısızlık olarak simüle eder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockPaymentResultInput"
      responses:
        "200":
          description: Test ödeme sonucu kaydedildi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiPaymentStatus"
        "400":
          description: Geçersiz test ödeme sonucu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ödeme oturumu bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Test ödeme modu aktif değil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/readiness:
    get:
      operationId: getPaymentReadiness
      tags: [payments]
      summary: Reports whether company payment prerequisites have been verified
      responses:
        "200":
          description: Payment readiness; live payments remain disabled until verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReadiness"
  /payments/checkout:
    post:
      operationId: createPaymentCheckout
      tags: [payments]
      summary: Starts a hosted payment checkout when compliance approval is complete
      description: |
        Accepts invoice details only. Card data must never be submitted to or stored
        by this API. Until company bank and licensed provider approvals are verified,
        the server rejects every checkout request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCheckoutInput"
      responses:
        "201":
          description: Hosted checkout created by the approved payment provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckoutSession"
        "400":
          description: Invalid invoice payment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Company bank or payment provider approval is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/request-download-url:
    post:
      tags: [Storage]
      operationId: requestObjectDownloadUrl
      summary: Başvuru belgesi için kısa süreli imzalı okuma adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectDownloadUrlRequest"
      responses:
        "200":
          description: İmzalı okuma adresi oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDownloadUrlResponse"
        "400":
          description: Geçersiz obje yolu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Belge bulunamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: İmzalı okuma adresi oluşturulamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Başvuru belgesi için güvenli yükleme adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Yükleme adresi oluşturuldu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Geçersiz dosya bilgisi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Yükleme adresi oluşturulamadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/cleanup-orphans:
    post:
      tags: [Storage]
      operationId: cleanupOrphanUploads
      summary: Başvuruya bağlanmayan eski yüklemeleri raporlar veya temizler
      description: |
        Zamanlanmış bakım işi tarafından çağrılmak üzere tasarlanmıştır.
        Varsayılan saklama süresi 24 saattir ve ORPHAN_UPLOAD_RETENTION_HOURS
        ortam değişkeniyle artırılabilir. Yalnızca admin ve operations personeli
        çağırabilir. dryRun true olduğunda hiçbir obje silinmez.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanUploadCleanupRequest"
      responses:
        "200":
          description: Temizlik özeti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanUploadCleanupResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin or operations access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Geçersiz temizlik isteği.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Temizlik gerçekleştirilemedi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items:
    get:
      operationId: getMediaItems
      tags: [media]
      summary: Personel medya merkezi kayıtlarını listeler
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/MediaItemStatus"
        - in: query
          name: query
          schema:
            type: string
            maxLength: 120
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        "200":
          description: Personel medya kayıtları
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemPage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createMediaItem
      tags: [media]
      summary: Personel medya merkezi kaydı oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaItemInput"
      responses:
        "201":
          description: Medya kaydı oluşturuldu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "400":
          description: Geçersiz medya bilgisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items/{id}:
    patch:
      operationId: updateMediaItem
      tags: [media]
      summary: Personel medya merkezi kaydını günceller
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaItemUpdate"
      responses:
        "200":
          description: Medya kaydı güncellendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "400":
          description: Geçersiz medya güncellemesi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Medya kaydı bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items/{id}/download-url:
    post:
      operationId: requestMediaItemDownloadUrl
      tags: [media]
      summary: Personel medya dosyası için kısa süreli indirme adresi oluşturur
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Kısa süreli indirme adresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDownloadUrlResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Medya dosyası bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items/{id}/publish:
    post:
      operationId: publishMediaItem
      tags: [media]
      summary: Kurucu onaylı gerçek pilot içeriğini Telegram'a gönderir
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Medya yayınlandı veya daha önce yayınlanmış kaydın gönderimi tekrarlandı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "400":
          description: Geçersiz medya numarası
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Medya kaydı bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Telegram gönderimi başarısız
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /media/items/{id}/submit:
    post:
      operationId: submitMediaItem
      tags: [media]
      summary: Taslağı medya sorumlusu incelemesine gönderir
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: İncelemeye gönderildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/items/{id}/review:
    post:
      operationId: reviewMediaItem
      tags: [media]
      summary: Medya sorumlusu içeriği inceler
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaDecision"
      responses:
        "200":
          description: İnceleme kaydedildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/items/{id}/founder-decision:
    post:
      operationId: decideMediaItem
      tags: [media]
      summary: Kurucu yayını onaylar veya gerekçeyle taslağa iade eder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaDecision"
      responses:
        "200":
          description: Kurucu kararı kaydedildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/items/{id}/record-publication:
    post:
      operationId: recordMediaPublication
      tags: [media]
      summary: Manuel gerçek yayın bağlantısını ve sonucunu kaydeder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaPublicationRecord"
      responses:
        "200":
          description: Gerçek yayın bağlantısı kurucu teyidine gönderildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/items/{id}/confirm-publication:
    post:
      operationId: confirmMediaPublication
      tags: [media]
      summary: Kurucu gerçek gönderi bağlantısını kontrol ederek yayını teyit eder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Gerçek yayın teyit edildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/uploads/request-url:
    post:
      operationId: requestMediaUploadUrl
      tags: [media]
      summary: Personel medya dosyası için güvenli yükleme adresi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadUrlRequest"
      responses:
        "200":
          description: Güvenli yükleme adresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadUrlResponse"
        "400":
          description: Geçersiz medya dosyası
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Yükleme adresi oluşturulamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storefront/construction/catalog:
    get:
      operationId: getConstructionCatalog
      tags: [storefront]
      summary: Shopify inşaat ürünleri kataloğunu okur
      responses:
        "200":
          description: Bağlı Shopify kataloğu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstructionCatalog"
        "503":
          description: Shopify kataloğu okunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /public/logistics/media:
    get:
      operationId: getPublicLogisticsMedia
      tags: [public-logistics]
      summary: Yayınlanmış lojistik medya içeriklerini listeler
      responses:
        "200":
          description: Public-safe lojistik medya kayıtları
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicLogisticsMedia"
  /public/logistics/media/{id}/file:
    get:
      operationId: getPublicLogisticsMediaFile
      tags: [public-logistics]
      summary: Yayınlanmış lojistik medya dosyasını açar
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "302":
          description: Kısa süreli imzalı medya URL'sine yönlendirme
        "400":
          description: Geçersiz medya numarası
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /logistics/requests:
    post:
      operationId: createLogisticsRequest
      tags: [logistics-operations]
      summary: Yeni yük talebi oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogisticsRequestInput"
      responses:
        "201":
          description: Yük talebi ve operasyon kaydı oluşturuldu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsRequestRecord"
        "400":
          description: Geçersiz yük talebi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /logistics/carriers:
    post:
      operationId: createLogisticsCarrier
      tags: [logistics-operations]
      summary: Taşıyıcı başvurusu oluşturur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogisticsCarrierInput"
      responses:
        "201":
          description: Taşıyıcı başvurusu oluşturuldu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsCarrierRecord"
        "400":
          description: Geçersiz taşıyıcı başvurusu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /logistics/staff:
    get:
      operationId: getLogisticsStaff
      tags: [logistics-operations]
      summary: Aktif operasyon personelini listeler
      responses:
        "200":
          description: Aktif personel listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogisticsStaffMember"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /logistics/operations:
    get:
      operationId: getLogisticsOperations
      tags: [logistics-operations]
      summary: Lojistik operasyon paneli verilerini listeler
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/LogisticsShipmentStatus"
        - in: query
          name: requestId
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Operasyon paneli verileri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsOperationsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /logistics/requests/{id}/status:
    patch:
      operationId: updateLogisticsRequestStatus
      tags: [logistics-operations]
      summary: Yük talebinin operasyon durumunu günceller
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogisticsRequestStatusUpdate"
      responses:
        "200":
          description: Güncellenmiş sevkiyat kaydı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsShipmentRecord"
        "400":
          description: Geçersiz operasyon durumu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
