kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/kasa/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/api-server/scripts/start-logistics-services.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
MMT_LOGISTICS_POOL_AI_DRAFTS_ENABLED = "false"

[services.production.health.startup]
path = "/api/healthz"
